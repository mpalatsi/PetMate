{% extends "base.html" %}

{% block title %}Upload to Gallery - PetMate{% endblock %}

{% block content %}
<div class="container">
    <div class="upload-photo-container">
        <h2>Upload to Pet Gallery</h2>
        
        <form method="POST" enctype="multipart/form-data" class="upload-photo-form">
            <div class="form-group">
                <label for="photo">Select Photo:</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="photo" name="photo" accept="image/*" required>
                    <div class="file-upload-preview">
                        <img id="photo-preview" src="#" alt="Preview" style="display: none;">
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" placeholder="Give your photo a title">
            </div>
            
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="3" placeholder="Tell us about this photo..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="pet_id">Which pet is in this photo? (optional)</label>
                <select id="pet_id" name="pet_id">
                    <option value="">-- Select a pet --</option>
                    {% for pet in pets %}
                        <option value="{{ pet.id }}">{{ pet.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="is_public" name="is_public" checked>
                <label for="is_public">Make this photo public (visible to all users)</label>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="button primary">Upload Photo</button>
                <a href="{{ url_for('public_gallery') }}" class="button">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    // Show preview of selected image
    const photoInput = document.getElementById('photo');
    const photoPreview = document.getElementById('photo-preview');
    
    photoInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                photoPreview.src = e.target.result;
                photoPreview.style.display = 'block';
            }
            
            reader.readAsDataURL(this.files[0]);
        }
    });
</script>
{% endblock %}
