{% extends "base.html" %}

{% block title %}Edit Photo - PetMate{% endblock %}

{% block extra_head %}
<style>
    .edit-photo-page {
        background-color: #fbfbfb;
        padding: 40px 0;
        min-height: calc(100vh - 60px);
    }
    
    .edit-photo-container {
        max-width: 800px;
        margin: 0 auto;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        padding: 30px;
    }
    
    .edit-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .edit-header h2 {
        color: #333;
        font-size: 2rem;
        font-weight: 600;
        margin: 0 0 10px;
        position: relative;
        display: inline-block;
    }
    
    .edit-header h2:after {
        content: '';
        display: block;
        width: 80px;
        height: 3px;
        background-color: var(--sage-green);
        margin: 10px auto 0;
        border-radius: 2px;
    }
    
    .edit-form {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }
    
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
    .form-group label {
        font-weight: 600;
        color: #444;
        font-size: 1rem;
    }
    
    .form-group input[type="text"],
    .form-group textarea {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
    }
    
    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
        border-color: var(--sage-green);
        outline: none;
    }
    
    .form-group textarea {
        min-height: 100px;
        resize: vertical;
    }
    
    .form-group select {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        background-color: white;
        cursor: pointer;
    }
    
    .photo-preview {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 20px;
    }
    
    .form-actions {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 10px;
    }
</style>
{% endblock %}

{% block content %}
<div class="edit-photo-page">
    <div class="edit-photo-container">
        <div class="edit-header">
            <h2>Edit Photo</h2>
        </div>
        
        <img src="{{ url_for('static', filename='pet_images/gallery_photos/' + photo.filename) }}" 
             alt="{{ photo.title or 'Pet photo' }}" 
             class="photo-preview">
        
        <form method="POST" class="edit-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{ photo.title or '' }}" placeholder="Give your photo a title">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Tell us about this photo...">{{ photo.description or '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="pet_id">Which pet is in this photo? (optional)</label>
                <select id="pet_id" name="pet_id">
                    <option value="">-- Select a pet --</option>
                    {% for pet in pets %}
                        <option value="{{ pet.id }}" {% if photo.pet_id == pet.id %}selected{% endif %}>{{ pet.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="button primary">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a href="{{ url_for('main.gallery') }}" class="button secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
