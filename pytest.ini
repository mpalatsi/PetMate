[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    auth: tests related to authentication and authorization
    routes: tests for basic routes functionality
    gallery: tests for gallery functionality
    admin: tests for admin functionality
    mobile: tests for mobile-specific functionality
    nondestructive: mark a test as nondestructive, i.e. it doesn't change data (pytest-selenium)
    selenium: mark a test as a selenium test
addopts = -v 

# Configure pytest-selenium
# By default, Selenium considers all URLs as sensitive, requiring a nondestructive marker
# This configuration changes that behavior for localhost
sensitive_url = example\.com

# Output configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S 