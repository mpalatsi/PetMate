{% extends "base.html" %}

{% block title %}Upload to Gallery - PetMate{% endblock %}

{% block content %}
<div class="container" style="margin-top: 30px;">
    <div style="max-width: 800px; margin: 0 auto; padding: 20px; border-radius: 10px; border: 1px solid #ddd;">
        <h2 style="text-align: center;">Upload to Pet Gallery</h2>
        
        <form method="POST" enctype="multipart/form-data" class="upload-photo-form" id="uploadForm">
            <div style="margin-bottom: 20px;">
                <label for="photo" style="display: block; margin-bottom: 10px; font-weight: bold;">Select Photo:</label>
                <div style="border: 3px dashed green; padding: 30px; text-align: center; background-color: #f0fff0; border-radius: 10px;">
                    <input type="file" id="photo" name="photos[]" accept="image/*" required>
                    <div id="photoSelectedMessage" style="display: none; background-color: green; color: white; padding: 8px; margin-top: 10px; border-radius: 5px; font-weight: bold;">
                        ✓ Photo Selected
                    </div>
                    <div id="previewContainer" style="margin-top: 15px; max-width: 100%; display: none;">
                        <img id="photoPreview" src="#" alt="Preview" style="max-width: 100%; max-height: 300px; border-radius: 5px;">
                    </div>
                </div>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label for="title" style="display: block; margin-bottom: 5px; font-weight: bold;">Title:</label>
                <input type="text" id="title" name="title" placeholder="Give your photo a title" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label for="description" style="display: block; margin-bottom: 5px; font-weight: bold;">Description:</label>
                <textarea id="description" name="description" rows="3" placeholder="Tell us about this photo..." style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;"></textarea>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label for="pet_id" style="display: block; margin-bottom: 5px; font-weight: bold;">Which pet is in this photo? (optional)</label>
                <select id="pet_id" name="pet_id" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                    <option value="">-- Select a pet --</option>
                    {% for pet in pets %}
                        <option value="{{ pet.id }}">{{ pet.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold;">
                    <input type="checkbox" id="is_public" name="is_public" checked style="margin-right: 5px;">
                    Make this photo public (visible to all users)
                </label>
            </div>
            
            <div style="text-align: center;">
                <button type="submit" style="background-color: #68a063; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">Upload Photo</button>
                <a href="{{ url_for('main.gallery') }}" style="background-color: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 5px; text-decoration: none; display: inline-block;">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const photoInput = document.getElementById('photo');
        const photoPreview = document.getElementById('photoPreview');
        const previewContainer = document.getElementById('previewContainer');
        const photoSelectedMessage = document.getElementById('photoSelectedMessage');
        
        photoInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    photoPreview.src = e.target.result;
                    previewContainer.style.display = 'block';
                    photoSelectedMessage.style.display = 'block';
                }
                
                reader.readAsDataURL(this.files[0]);
            }
        });
    });
</script>
{% endblock %}
