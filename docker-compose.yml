version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-petmate}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-petmatepassword}
      - POSTGRES_DB=${POSTGRES_DB:-petmate}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petmate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/petmate}:${IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-petmate}:${POSTGRES_PASSWORD:-petmatepassword}@db/${POSTGRES_DB:-petmate}
      - SECRET_KEY=${SECRET_KEY:-please-change-this-in-production}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    ports:
      - "${WEB_PORT:-5000}:5000"
    restart: unless-stopped
    command: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:5000 --timeout 120 wsgi:app

volumes:
  postgres_data: 